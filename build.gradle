plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
}

group = 'com.deepspring'
version = '0.1.0'

springBoot {
    mainClass = 'com.deepspring.boot.MinimalBootApp'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:6.2.1'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'org.springframework:spring-aspects:6.2.1'
    implementation 'org.aspectj:aspectjweaver:1.9.22'
    implementation 'org.springframework:spring-jdbc:6.2.1'
    implementation 'com.h2database:h2:2.3.232'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.hibernate.orm:hibernate-core:6.6.4.Final'

    // Phase 8: Servlet / Tomcat 실험용
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.34'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.springframework:spring-webmvc:6.2.1'

    // Phase 9: Starter가 뭘 딸고 오는지 확인용 (아직 Boot plugin 없음)
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.4.1'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.14.2'

    // Phase 13: Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.4.1'

    // Phase 14: Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security:3.4.1'

    // Phase 15: Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.1'
    testImplementation 'org.springframework.security:spring-security-test:6.4.2'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// 실험용 main() 클래스를 gradle 없이 java -cp로 직접 돌릴 때 쓸 classpath 출력
tasks.register('printTestClasspath') {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}

// 실험용 main() 클래스 직접 실행: ./gradlew runExperiment -PmainClass=com.deepspring.xxx.YyyExperiment
tasks.register('runExperiment', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = providers.gradleProperty('mainClass')
}
